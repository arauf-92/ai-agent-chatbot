<html>
    <head>
        <title>AI Agent Chatbot</title>
        <link rel="icon" type="image/png" href="icon-chat.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <script src="chat.js" defer></script>
        <link rel="stylesheet" href="style.css">
        <div class="container mt-5 input-container">
            <h2 id="greetingHeading" align="middle"><span id="greeting"></span></h2>
            <div class="mt-3" id="chatContainer">
                <p id="userQuery" class="user-bubble"></p>
                <p id="response" class="assistant-bubble"></p>
                <div id="thinking" class="thinking">
                    <img src="creative.gif" class="thinking-gif">Thinking...
                </div>
            </div>
            <div class="mb-3 mt-3 textarea-wrapper">
                <textarea class="form-control" rows="2" id="userInput" name="text" placeholder="How can I help you today?" style="height: 220px;"></textarea>
                <!-- File attachment -->
                <input class="icon-user" type="file" id="inputFile" hidden>
                <label for="inputFile" class="file-label">
                    <img src="icon-attach.png" id="uploadIcon" alt="Choose file" title="Add files or photos">
                    <span id="fileName"></span>
                </label>
                <!-- Think checkbox -->
                <label class="think-label" for="thinkCheck" >
                    <input type="checkbox" class="form-check-input" id="thinkCheck">
                    <span title="Get a smarter answer">
                        <img src="icon-brain.png" id="thinkingIcon" alt="Enable think">
                        <span id="thinkText">Think</span>
                    </span>
                </label>
                <!-- Submit button -->
                <button id="submit" type="button" class="submit-button" title="Send message" disabled>
                    <img src="icon-send.png" alt="Send message">
                </button>
            </div>
        </div>
    </body>
</html>
